jdk:
  - openjdk21

install:
  - |
    unset MAVEN_HOME M2_HOME MAVEN_CONFIG

    curl -fL --retry 3 \
      https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz \
      -o maven.tar.gz

    tar -xzf maven.tar.gz

    ls -la apache-maven-3.9.6/
    ls -la apache-maven-3.9.6/boot/

    ./apache-maven-3.9.6/bin/mvn -version
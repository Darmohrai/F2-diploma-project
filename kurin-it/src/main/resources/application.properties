# The same for every instance; what differs per instance is passed when it is started
management.endpoints.web.exposure.include=health,kurin,metrics
management.endpoint.health.show-details=always

kurin.node.advertised-host=127.0.0.1
kurin.node.bind-host=127.0.0.1
kurin.node.storage=memory
kurin.node.heartbeat-interval=30ms
kurin.node.election-timeout-min=300ms
kurin.node.election-timeout-max=600ms

kurin.cache.defaults.ttl=5m
kurin.cache.codec.allowed-packages=org.kurin.it

kurin.routing.token-secret=kurin-it-secret
kurin.routing.sticky-window=30s
kurin.routing.health.interval=200ms
